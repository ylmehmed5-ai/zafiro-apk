name: Zafiro APK Olustur

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Cek
      uses: actions/checkout@v4

    - name: Zip Dosyasini Cikart
      run: unzip -q zafiro-19-1.11.0.zip -d proje_klasoru

    - name: Python 3.11 Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Java JDK 17 Kur
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: APK Derle
      run: |
        GRADLE_DIR=$(find proje_klasoru -name "gradlew" -exec dirname {} \; | head -n 1)
        cd "$GRADLE_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: APK Yukle
      uses: actions/upload-artifact@v4
      with:
        name: Zafiro-APK
        path: proje_klasoru/**/build/outputs/apk/debug/*.apk
